version: 1
source_glob: skills/*/SKILL.md
skills:
  - name: imm-brainstorm
    path: skills/imm-brainstorm/SKILL.md
    role: brainstorm
    title: Brainstormer
    role_class: framing
    canonical: true
    modes: [default, roundtable, adversarial]
    output_artifacts: [brainstorm_framing]
    next_actions: [imm-planner]
    boundary: Problem framing only; no implementation or QA closure.
  - name: imm-planner
    path: skills/imm-planner/SKILL.md
    role: plan
    title: Planner
    role_class: authority
    canonical: true
    output_artifacts: [validated_plan]
    next_actions: [imm-run]
    boundary: Owns plan creation and revision; no executor edits.
  - name: imm-run
    path: skills/imm-run/SKILL.md
    role: coordinate
    title: Run
    role_class: coordinator
    canonical: true
    output_artifacts: [run_status]
    next_actions: [imm-planner]
    boundary: Coordinate the validated plan through execution, review, and settlement; no planning bypass.
  - name: imm-pr-fix
    path: skills/imm-pr-fix/SKILL.md
    role: execute
    title: PR Fix
    role_class: repair
    canonical: true
    output_artifacts: [repair_report]
    next_actions: []
    boundary: Repair one GitHub PR directly; no Managed authority mutation or scope expansion.
  - name: imm-doc-prune
    path: skills/imm-doc-prune/SKILL.md
    role: execute
    title: Doc Prune
    role_class: repair
    canonical: true
    output_artifacts: [prune_report]
    next_actions: []
    boundary: Prune stale current documentation after explicit manifest approval; no Managed authority mutation or authority-artifact deletion.
  - name: imm-doc-slim
    path: skills/imm-doc-slim/SKILL.md
    role: execute
    title: Doc Slim
    role_class: repair
    canonical: true
    output_artifacts: [maintain_report]
    next_actions: []
    boundary: Minimize tracked agent-instruction context after explicit manifest approval; no Managed authority mutation, contract installation, or reference-document creation.
  - name: imm-retro
    path: skills/imm-retro/SKILL.md
    role: execute
    title: Retro
    role_class: discovery
    canonical: true
    output_artifacts: [retro_report]
    next_actions: []
    boundary: Rank models by review load and report project usage from pi session logs. Read-only. No Managed Path mutation.
