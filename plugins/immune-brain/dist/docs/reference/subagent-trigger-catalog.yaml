version: 1
scope: session_scoped_host_activation
policy_ref: docs/reference/automatic-subagent-activation-policy.md
spec_ref: docs/specs/automatic-subagent-activation.spec.md
# validate refs with: imm-activation-plan --validate-refs

# Field reference for lens entries:
#
#   model_tier: fast | mid | strong | inherit   (optional; default: inherit)
#     Semantic cost tier for this lens. Resolved to a concrete model id by the
#     dispatch host at runtime via [subagent_models] in the selected agent-local config.toml.
#     "inherit" means the advisory reviewer uses the host session model unchanged.
#     Current assignments: security/api-contract/data-integrity → mid, reliability/UI → fast.

hosts:
  imm-code-review:
    max_parallel_children: 5
    default_parallel_allowed: true
    fallback_reasons:
      - trigger_not_hit
      - unclear_boundary
      - unavailable_environment
      - cost_scope_mismatch
      - user_requested
    children:
      imm-advisory-reviewer:
        authority: advisory_only
        lenses:
          security:
            model_tier: mid
            trigger_surface:
              keywords:
                - authentication
                - authorization
                - auth
                - authz
                - input validation
                - public endpoint
                - secret
                - permission model
                - security config
                - security-sensitive configuration
              path_globs:
                - "**/auth/**"
                - "**/security/**"
                - "**/permissions/**"
                - "**/middleware/**"
                - "**/*auth*"
                - "**/*permission*"
                - "**/*secret*"
              rationale_codes:
                - security_trigger
            output_artifact: security_review

          api_contract:
            model_tier: mid
            trigger_surface:
              keywords:
                - API route
                - request schema
                - response schema
                - serialization
                - versioning
                - exported type
                - public SDK
                - CLI contract
                - public contract
              path_globs:
                - "**/api/**"
                - "**/routes/**"
                - "**/contracts/**"
                - "**/openapi/**"
                - "**/*openapi*"
                - "**/*swagger*"
                - "**/*contract*"
                - "**/*types*"
              rationale_codes:
                - api_contract_trigger
            output_artifact: api_contract_review

          data_integrity:
            model_tier: mid
            trigger_surface:
              keywords:
                - migration
                - schema migration
                - data migration
                - persistence boundary
                - import flow
                - export flow
                - data redaction
                - anonymization
                - integrity constraint
                - stored data
              path_globs:
                - "**/migrations/**"
                - "**/migrate/**"
                - "**/persistence/**"
                - "**/import/**"
                - "**/export/**"
                - "**/*migration*"
                - "db/**"
                - "prisma/**"
                - "**/models/**"
              rationale_codes:
                - data_integrity_trigger
            output_artifact: data_integrity_review

          reliability:
            model_tier: fast
            trigger_surface:
              keywords:
                - retry policy
                - timeout
                - queue
                - background job
                - error handling
                - health check
                - external dependency
                - circuit breaker
                - rate limit
                - failover
              path_globs:
                - "**/retry/**"
                - "**/queue/**"
                - "**/jobs/**"
                - "**/workers/**"
                - "**/health/**"
                - "**/*retry*"
                - "**/*timeout*"
                - "**/*queue*"
                - "**/*worker*"
                - "**/*health*"
              rationale_codes:
                - reliability_trigger
            output_artifact: reliability_review

  imm-ui-review:
    max_parallel_children: 5
    default_parallel_allowed: true
    fallback_reasons:
      - trigger_not_hit
      - unclear_boundary
      - unavailable_environment
      - cost_scope_mismatch
      - user_requested
    children:
      imm-advisory-reviewer:
        authority: advisory_only
        lenses:
          ui_a11y:
            model_tier: fast
            trigger_surface:
              keywords:
                - accessibility
                - a11y
                - keyboard navigation
                - screen reader
                - aria
                - focus state
                - contrast
                - reduced motion
              path_globs:
                - "**/*.css"
                - "**/*.scss"
                - "**/*.tsx"
                - "**/*.jsx"
                - "**/*view*"
                - "**/*component*"
                - "**/*accessibility*"
                - "**/*a11y*"
              rationale_codes:
                - ui_a11y_trigger
            output_artifact: a11y_review

          ui_responsive:
            model_tier: fast
            trigger_surface:
              keywords:
                - responsive
                - mobile
                - tablet
                - breakpoint
                - viewport
                - layout shift
                - overflow
                - wrapping
              path_globs:
                - "**/*.css"
                - "**/*.scss"
                - "**/*.tsx"
                - "**/*.jsx"
                - "**/*layout*"
                - "**/*responsive*"
                - "**/*breakpoint*"
                - "**/*component*"
              rationale_codes:
                - ui_responsive_trigger
            output_artifact: responsive_review

          ui_i18n:
            model_tier: fast
            trigger_surface:
              keywords:
                - i18n
                - l10n
                - internationalization
                - localization
                - locale
                - locales
                - translation
                - translations
                - RTL
                - right-to-left
                - localized asset
                - hardcoded text
                - useTranslation
                - formatMessage
                - Intl.NumberFormat
                - Intl.DateTimeFormat
                - plural
              path_globs:
                - "**/locales/**"
                - "**/locale/**"
                - "**/i18n/**"
                - "**/l10n/**"
                - "**/lang/**"
                - "**/messages/**"
                - "**/*locale*"
                - "**/*i18n*"
                - "**/*l10n*"
                - "**/*translation*"
                - "**/*.po"
              rationale_codes:
                - ui_i18n_trigger
            output_artifact: i18n_review

          ux_heuristic:
            model_tier: fast
            trigger_surface:
              keywords:
                - ux heuristic
                - usability heuristic
                - nielsen
                - interaction flow
                - user journey
                - progressive disclosure
                - error prevention
                - smart defaults
                - empty state
                - skeleton loader
                - feedback first
              path_globs:
                - "**/*flow*"
                - "**/*journey*"
                - "**/*wizard*"
                - "**/*form*"
                - "**/*empty*"
                - "**/*onboarding*"
              rationale_codes:
                - ux_heuristic_trigger
            output_artifact: ux_heuristic_review

          ui_visual:
            model_tier: fast
            trigger_surface:
              keywords:
                - visual design
                - polish
                - spacing
                - typography
                - alignment
                - color
                - icon
                - visual regression
              path_globs:
                - "**/*.css"
                - "**/*.scss"
                - "**/*.tsx"
                - "**/*.jsx"
                - "**/*style*"
                - "**/*theme*"
                - "**/*component*"
                - "**/*design*"
              rationale_codes:
                - ui_visual_trigger
            output_artifact: visual_review
