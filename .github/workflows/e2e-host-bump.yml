name: E2E Host bump

# Weekly Host bump (Spec e2e-release-gate D3, S10): raise tests/e2e/hosts.json to the latest
# `claude` and `pi` releases, run the L1 journeys against them and open a pull request. A Host
# upgrade that changes behavior then lands as its own reviewable change instead of breaking an
# unrelated pull request. `claude.minimum` is never bumped.
#
# Pull requests opened with GITHUB_TOKEN do not start CI, so the journeys run here and the
# outcome is written into the pull request body. A failed run still opens the pull request.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: e2e-host-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump pinned Hosts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: chore/e2e-host-bump
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump tests/e2e/hosts.json
        id: bump
        # No pipe: a registry failure must fail this step, and a pipeline reports only its last command.
        shell: bash
        run: |
          bun scripts/bump-e2e-hosts.ts > bump.log
          cat bump.log
          if git diff --quiet -- tests/e2e/hosts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the bumped Hosts
        if: steps.bump.outputs.changed == 'true'
        run: |
          claude_version="$(jq -r .claude.pinned tests/e2e/hosts.json)"
          claude_min="$(jq -r .claude.minimum tests/e2e/hosts.json)"
          pi_version="$(jq -r .pi.pinned tests/e2e/hosts.json)"
          npm install --global "@anthropic-ai/claude-code@${claude_version}" "@earendil-works/pi-coding-agent@${pi_version}"
          if [ "$claude_min" != "$claude_version" ]; then
            npm install --prefix /tmp/e2e-claude-min "@anthropic-ai/claude-code@${claude_min}"
            echo "E2E_CLAUDE_MIN_BIN=/tmp/e2e-claude-min/node_modules/.bin/claude" >> "$GITHUB_ENV"
          fi

      - name: Run the e2e journeys
        id: e2e
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: bun run e2e

      - name: Open or refresh the bump pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git checkout -B "$BRANCH"
          git add tests/e2e/hosts.json
          git commit -m "chore(e2e): bump pinned Hosts"
          git push --force origin "$BRANCH"
          {
            echo "Weekly bump of the pinned Hosts in \`tests/e2e/hosts.json\` (Spec e2e-release-gate D3)."
            echo
            echo '```'
            cat bump.log
            echo '```'
            echo
            echo "L1 journeys against the new versions: **$E2E_OUTCOME** ($RUN_URL)"
          } > pr-body.md
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)" = OPEN ]; then
            gh pr edit "$BRANCH" --body-file pr-body.md
          else
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --title "chore(e2e): bump pinned Hosts" --body-file pr-body.md
          fi

      - name: Fail when the journeys failed
        if: steps.bump.outputs.changed == 'true' && steps.e2e.outcome == 'failure'
        run: |
          echo "L1 failed against the bumped Hosts; the pull request is open with the failing outcome."
          exit 1
