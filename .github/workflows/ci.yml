name: CI

# The release workflow runs on `push: main`, so until this file existed every
# check ran only after a merge. Four host-adapter defects reached a published
# plugin that way. Everything here must pass before a pull request can merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Typecheck
        run: bun run typecheck

      - name: Check the built Claude plugin is in sync
        run: bun scripts/build-claude-plugin.ts --check

      - name: Check bundled docs are in sync
        run: bun scripts/sync-dist-docs.ts --check

      - name: Validate plugin versioning
        run: bun scripts/plugin_versioning.ts validate

      - name: Test
        run: bun test
